name: compiled-artifact portability

on:
  push:
    branches:
      - "m3b-seal/**"
    paths-ignore:
      - "implementations/typescript/engine/src/generated/compiled-parser.build-certificate.json"
      - "implementations/typescript/engine/src/generated/compiled-resolver.build-certificate.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-check-packages:
    name: prepare canonical Git-object packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the pinned Bun coordinator
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13

      - name: Prepare compiled-resolver package from raw Git objects
        run: >-
          bun implementations/typescript/engine/scripts/prepare-compiled-artifact-check-package.ts
          --source-commit=$GITHUB_SHA
          --artifact=compiled-resolver
          --output=.tmp-m3b-ci/check-packages/compiled-resolver

      - name: Prepare compiled-parser package from raw Git objects
        run: >-
          bun implementations/typescript/engine/scripts/prepare-compiled-artifact-check-package.ts
          --source-commit=$GITHUB_SHA
          --artifact=compiled-parser
          --output=.tmp-m3b-ci/check-packages/compiled-parser

      - name: Upload the one canonical package pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-artifact-check-packages-${{ github.sha }}
          path: .tmp-m3b-ci/check-packages
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  check-portability:
    name: ${{ matrix.os-family }} package checks
    needs: prepare-check-packages
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-family: windows
            runner: windows-latest
          - os-family: linux
            runner: ubuntu-latest
          - os-family: macos
            runner: macos-latest
    steps:
      - name: Check out the exact package verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the pinned Bun coordinator
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13

      - name: Artifact toolchain and cold dependency contracts
        run: >-
          bun --no-env-file test --timeout 15000
          implementations/typescript/engine/scripts/lib/compiled-artifact-toolchain.test.ts
          implementations/typescript/engine/scripts/lib/compiled-artifact-dependencies.test.ts

      - name: Download the canonical package pair
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compiled-artifact-check-packages-${{ github.sha }}
          path: .tmp-m3b-ci/check-packages

      - name: Check compiled-resolver package and emit canonical attestation
        shell: bash
        run: |
          mkdir -p .tmp-m3b-ci/attestations
          bun implementations/typescript/engine/scripts/generate-compiled-resolver.ts \
            --check \
            --package=.tmp-m3b-ci/check-packages/compiled-resolver \
            --emit-attestation \
            > .tmp-m3b-ci/attestations/compiled-resolver.json

      - name: Check compiled-parser package and emit canonical attestation
        shell: bash
        run: |
          bun implementations/typescript/engine/scripts/generate-compiled-parser.ts \
            --check \
            --package=.tmp-m3b-ci/check-packages/compiled-parser \
            --emit-attestation \
            > .tmp-m3b-ci/attestations/compiled-parser.json

      - name: Upload compiled-resolver attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-resolver-${{ matrix.os-family }}-${{ github.sha }}
          path: .tmp-m3b-ci/attestations/compiled-resolver.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiled-parser attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-parser-${{ matrix.os-family }}-${{ github.sha }}
          path: .tmp-m3b-ci/attestations/compiled-parser.json
          if-no-files-found: error
          retention-days: 7
